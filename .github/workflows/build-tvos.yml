name: Build Luna tvOS Unsigned IPA

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: "GitHub-hosted macOS runner label (default: xcode-27)"
        required: false
        default: "xcode-27"
        type: string

permissions:
  contents: write

concurrency:
  group: build-tvos-release
  cancel-in-progress: false

jobs:
  test-tvos:
    name: Static Guardrails & LunaTests
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest Xcode (26.2+ / 27) with tvOS 26+ SDK
        run: |
          set -euo pipefail
          echo "Installed Xcode bundles:"
          ls -d /Applications/Xcode*.app || true

          SELECTED_XCODE=""
          for candidate in $(ls -d /Applications/Xcode*.app | sort -V -r); do
            if [ -x "$candidate/Contents/Developer/usr/bin/xcodebuild" ]; then
              SDK_VER=$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version -sdk appletvos SDKVersion 2>/dev/null || echo "0")
              MAJOR="${SDK_VER%%.*}"
              echo "  -> $candidate : appletvos SDK $SDK_VER"
              if [ "${MAJOR:-0}" -ge 26 ]; then
                SELECTED_XCODE="$candidate"
                break
              fi
            fi
          done

          if [ -z "$SELECTED_XCODE" ]; then
            echo "::error::No Xcode installation with appletvos SDK >= 26.0 found on runner!"
            exit 1
          fi

          echo "Selecting $SELECTED_XCODE"
          sudo xcode-select -s "$SELECTED_XCODE"
          xcodebuild -version
          swift --version

      - name: Ensure XcodeGen is installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi
          xcodegen --version

      - name: Cache SwiftPM & Compilation Cache (Simulator)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: tvos-sim-cache-${{ runner.os }}-${{ hashFiles('Packages/AetherBridge/Package.swift', 'project.yml') }}
          restore-keys: |
            tvos-sim-cache-${{ runner.os }}-

      - name: Static Guardrails (LOC, Permissions, Sideload & Public Hygiene)
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            lines=$(wc -l < "$f" | tr -d ' ')
            if [ "$lines" -gt 800 ]; then
              echo "::error::$f has $lines lines (max 800)"
              exit 1
            fi
            perm=$(stat -f '%Lp' "$f")
            if [ "$perm" != "644" ]; then
              echo "::error::$f has permissions $perm (expected 644)"
              exit 1
            fi
          done < <(find Sources Tests Packages -name '*.swift' -print0)

          if grep -rnE 'Bundle\.main\.bundleIdentifier' Sources Tests Packages; then
            echo "::error::Found forbidden Bundle.main.bundleIdentifier reference!"
            exit 1
          fi

          if grep -rnE '\b(10\.[0-9]{1,3}|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]{1,3}\.[0-9]{1,3}\b|/volume[12]/|luna_tv_' Sources Tests Packages; then
            echo "::error::Found forbidden private IP, NAS path, or token literal in Sources/, Tests/, or Packages/!"
            exit 1
          fi

      - name: Generate Luna.xcodeproj from project.yml
        run: xcodegen generate

      - name: Build & Run LunaTests
        run: |
          set -euo pipefail
          run_xcodebuild() {
            set +e
            "$@" 2>&1 | tee xcodebuild.log
            local rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then
              awk '/error:|fatal error:/ { print "::error::" $0; count++; if (count >= 25) exit }' xcodebuild.log
              exit "$rc"
            fi
          }

          TVOS_SIM_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "tvOS" not in runtime:
                  continue
              nums = tuple(int(x) for x in re.findall(r"\d+", runtime))
              for dev in devices:
                  if dev.get("isAvailable"):
                      booted = 1 if dev.get("state") == "Booted" else 0
                      candidates.append((booted, nums, dev.get("name", ""), dev["udid"]))
          candidates.sort(reverse=True)
          if candidates:
              print(candidates[0][3])
          ' || true)

          if [ -n "$TVOS_SIM_UDID" ]; then
            echo "Pre-booting & running LunaTests on tvOS Simulator ($TVOS_SIM_UDID)..."
            xcrun simctl boot "$TVOS_SIM_UDID" >/dev/null 2>&1 || true
            run_xcodebuild xcodebuild test \
              -project Luna.xcodeproj \
              -scheme Luna \
              -destination "platform=tvOS Simulator,id=$TVOS_SIM_UDID" \
              -derivedDataPath build-tests \
              -clonedSourcePackagesDirPath build/SourcePackages \
              COMPILER_INDEX_STORE_ENABLE=NO \
              DEBUG_INFORMATION_FORMAT=dwarf \
              COMPILATION_CACHE_ENABLE_CACHING=YES \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "No booted/available tvOS Simulator found; running build-for-testing for generic/platform=tvOS Simulator..."
            run_xcodebuild xcodebuild build-for-testing \
              -project Luna.xcodeproj \
              -scheme Luna \
              -destination 'generic/platform=tvOS Simulator' \
              -derivedDataPath build-tests \
              -clonedSourcePackagesDirPath build/SourcePackages \
              COMPILER_INDEX_STORE_ENABLE=NO \
              DEBUG_INFORMATION_FORMAT=dwarf \
              COMPILATION_CACHE_ENABLE_CACHING=YES \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi

  build-ipa:
    name: Build Unsigned Release IPA (arm64)
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest Xcode (26.2+ / 27) with tvOS 26+ SDK
        run: |
          set -euo pipefail
          SELECTED_XCODE=""
          for candidate in $(ls -d /Applications/Xcode*.app | sort -V -r); do
            if [ -x "$candidate/Contents/Developer/usr/bin/xcodebuild" ]; then
              SDK_VER=$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version -sdk appletvos SDKVersion 2>/dev/null || echo "0")
              MAJOR="${SDK_VER%%.*}"
              if [ "${MAJOR:-0}" -ge 26 ]; then
                SELECTED_XCODE="$candidate"
                break
              fi
            fi
          done

          if [ -z "$SELECTED_XCODE" ]; then
            echo "::error::No Xcode installation with appletvos SDK >= 26.0 found on runner!"
            exit 1
          fi

          sudo xcode-select -s "$SELECTED_XCODE"
          xcodebuild -version

      - name: Ensure XcodeGen is installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi

      - name: Cache SwiftPM & Compilation Cache (Release)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: tvos-release-cache-${{ runner.os }}-${{ hashFiles('Packages/AetherBridge/Package.swift', 'project.yml') }}
          restore-keys: |
            tvos-release-cache-${{ runner.os }}-

      - name: Generate Luna.xcodeproj from project.yml
        run: xcodegen generate

      - name: Build unsigned Release app for tvOS device (arm64)
        run: |
          set -euo pipefail
          run_xcodebuild() {
            set +e
            "$@" 2>&1 | tee xcodebuild.log
            local rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then
              awk '/error:|fatal error:/ { print "::error::" $0; count++; if (count >= 25) exit }' xcodebuild.log
              exit "$rc"
            fi
          }

          run_xcodebuild xcodebuild build \
            -project Luna.xcodeproj \
            -scheme Luna \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload/Luna.app into Luna-unsigned.ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-appletvos/Luna.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected $APP_PATH was not produced by xcodebuild"
            exit 1
          fi
          if [ ! -f "$APP_PATH/Assets.car" ]; then
            echo "::error::Expected $APP_PATH/Assets.car was not compiled into Luna.app"
            exit 1
          fi

          ATS_ALLOW=$(/usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$APP_PATH/Info.plist")
          BONJOUR_SVC=$(/usr/libexec/PlistBuddy -c "Print :NSBonjourServices:0" "$APP_PATH/Info.plist")
          echo "Verified Info.plist: NSAllowsArbitraryLoads=${ATS_ALLOW}, NSBonjourServices[0]=${BONJOUR_SVC}"
          if [ "$ATS_ALLOW" != "true" ] || [ "$BONJOUR_SVC" != "_mediaos._tcp" ]; then
            echo "::error::Compiled Info.plist is missing ATS LAN HTTP or _mediaos._tcp Bonjour keys!"
            exit 1
          fi

          rm -rf dist Payload
          mkdir -p dist Payload
          cp -R "$APP_PATH" Payload/Luna.app
          ditto -c -k --sequesterRsrc --keepParent Payload dist/Luna-unsigned.ipa
          rm -rf Payload

          shasum -a 256 dist/Luna-unsigned.ipa > dist/Luna-unsigned.ipa.sha256
          ls -lh dist/
          cat dist/Luna-unsigned.ipa.sha256

      - name: Upload workflow build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luna-unsigned-ipa
          path: |
            dist/Luna-unsigned.ipa
            dist/Luna-unsigned.ipa.sha256
          retention-days: 30

  publish-release:
    name: Publish Rolling Latest Release
    runs-on: ubuntu-latest
    needs: [test-tvos, build-ipa]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Luna-unsigned-ipa
          path: dist

      - name: Verify downloaded artifacts
        run: |
          set -euo pipefail
          test -s dist/Luna-unsigned.ipa
          test -s dist/Luna-unsigned.ipa.sha256
          ls -lh dist/
          cat dist/Luna-unsigned.ipa.sha256

      - name: Publish Luna-unsigned.ipa to rolling GitHub Release 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          BUILD_UTC="$(date -u '+%Y-%m-%d %H:%M UTC')"
          NOTES="Automated tvOS unsigned build of **Luna** (\`${SHORT_SHA}\`, ${BUILD_UTC}). Ready for wireless signing & 7-day auto-renewal in **ATVLoadly**."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest HEAD
          git push origin refs/tags/latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/Luna-unsigned.ipa dist/Luna-unsigned.ipa.sha256 --clobber
            gh release edit latest --title "Luna (Latest tvOS Build)" --notes "$NOTES" --latest
          else
            gh release create latest dist/Luna-unsigned.ipa dist/Luna-unsigned.ipa.sha256 \
              --title "Luna (Latest tvOS Build)" \
              --notes "$NOTES" \
              --latest
          fi
