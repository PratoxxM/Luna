name: Build Luna tvOS Unsigned IPA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: "GitHub-hosted macOS runner label (default: xcode-27)"
        required: false
        default: "xcode-27"
        type: string

permissions:
  contents: read

concurrency:
  group: build-tvos-release
  cancel-in-progress: false

jobs:
  static-guardrails:
    name: Static Guardrails (Permissions, LOC & Public Hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Luna static guardrails (luna-check)
        run: |
          set -euo pipefail
          bash ops/bin/luna-check

  linux-core-tests:
    name: LunaCoreTests (Linux Swift 6.2)
    needs: static-guardrails
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run LunaCoreTests on Linux
        run: swift test --parallel

  test-tvos:
    name: LunaTests (tvOS Simulator)
    needs: [static-guardrails, linux-core-tests]
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tvOS Xcode & XcodeGen
        uses: ./.github/actions/setup-tvos-xcode

      - name: Cache SwiftPM & Compilation Cache (Simulator)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: tvos-sim-cache-${{ runner.os }}-${{ hashFiles('Packages/AetherBridge/Package.swift', 'project.yml') }}
          restore-keys: |
            tvos-sim-cache-${{ runner.os }}-

      - name: Generate Luna.xcodeproj from project.yml
        run: xcodegen generate

      - name: Build & Run LunaTests
        run: |
          set -euo pipefail
          run_xcodebuild() {
            set +e
            "$@" 2>&1 | tee xcodebuild.log
            local rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then
              awk '/error:|fatal error:/ { print "::error::" $0; count++; if (count >= 25) exit }' xcodebuild.log
              exit "$rc"
            fi
          }

          TVOS_SIM_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "tvOS" not in runtime:
                  continue
              nums = tuple(int(x) for x in re.findall(r"\d+", runtime))
              for dev in devices:
                  if dev.get("isAvailable"):
                      booted = 1 if dev.get("state") == "Booted" else 0
                      candidates.append((booted, nums, dev.get("name", ""), dev["udid"]))
          candidates.sort(reverse=True)
          if candidates:
              print(candidates[0][3])
          ' || true)

          if [ -z "$TVOS_SIM_UDID" ]; then
            echo "::error::No available tvOS Simulator found on runner; refusing to skip LunaTests."
            exit 1
          fi

          echo "Pre-booting & running LunaTests on tvOS Simulator ($TVOS_SIM_UDID)..."
          xcrun simctl boot "$TVOS_SIM_UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$TVOS_SIM_UDID" -b
          run_xcodebuild xcodebuild test \
            -project Luna.xcodeproj \
            -scheme Luna \
            -destination "platform=tvOS Simulator,id=$TVOS_SIM_UDID" \
            -derivedDataPath build-tests \
            -clonedSourcePackagesDirPath build/SourcePackages \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  build-ipa:
    name: Build Unsigned Release IPA (arm64)
    needs: [static-guardrails, linux-core-tests]
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup tvOS Xcode & XcodeGen
        uses: ./.github/actions/setup-tvos-xcode

      - name: Cache SwiftPM & Compilation Cache (Release)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: tvos-release-cache-${{ runner.os }}-${{ hashFiles('Packages/AetherBridge/Package.swift', 'project.yml') }}
          restore-keys: |
            tvos-release-cache-${{ runner.os }}-

      - name: Generate Luna.xcodeproj from project.yml
        run: xcodegen generate

      - name: Build unsigned Release app for tvOS device (arm64)
        run: |
          set -euo pipefail
          BUILD_NUM="$(git rev-list --count HEAD)"
          echo "Resolved monotonic CURRENT_PROJECT_VERSION=${BUILD_NUM}"

          run_xcodebuild() {
            set +e
            "$@" 2>&1 | tee xcodebuild.log
            local rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then
              awk '/error:|fatal error:/ { print "::error::" $0; count++; if (count >= 25) exit }' xcodebuild.log
              exit "$rc"
            fi
          }

          run_xcodebuild xcodebuild build \
            -project Luna.xcodeproj \
            -scheme Luna \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload/Luna.app into Luna-unsigned.ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-appletvos/Luna.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected $APP_PATH was not produced by xcodebuild"
            exit 1
          fi
          if [ ! -f "$APP_PATH/Assets.car" ]; then
            echo "::error::Expected $APP_PATH/Assets.car was not compiled into Luna.app"
            exit 1
          fi

          ATS_ALLOW=$(/usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$APP_PATH/Info.plist")
          BONJOUR_SVC=$(/usr/libexec/PlistBuddy -c "Print :NSBonjourServices:0" "$APP_PATH/Info.plist")
          PRIMARY_ICON=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon" "$APP_PATH/Info.plist")
          TOP_SHELF_STD=$(/usr/libexec/PlistBuddy -c "Print :TVTopShelfImage:TVTopShelfPrimaryImage" "$APP_PATH/Info.plist")
          TOP_SHELF_WIDE=$(/usr/libexec/PlistBuddy -c "Print :TVTopShelfImage:TVTopShelfPrimaryImageWide" "$APP_PATH/Info.plist")
          BUNDLE_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist")
          echo "Verified Info.plist: CFBundleVersion=${BUNDLE_BUILD}, PrimaryIcon=${PRIMARY_ICON}, TopShelf=${TOP_SHELF_STD} / ${TOP_SHELF_WIDE}, ATS=${ATS_ALLOW}, Bonjour=${BONJOUR_SVC}"
          if [ "$ATS_ALLOW" != "true" ] || [ "$BONJOUR_SVC" != "_lunacore._tcp" ]; then
            echo "::error::Compiled Info.plist is missing ATS LAN HTTP or _lunacore._tcp Bonjour keys!"
            exit 1
          fi
          if [ "$PRIMARY_ICON" != "App Icon" ] || [ "$TOP_SHELF_STD" != "Top Shelf Image" ] || [ "$TOP_SHELF_WIDE" != "Top Shelf Image Wide" ]; then
            echo "::error::Compiled Info.plist is missing App Icon or Top Shelf BrandAsset entries!"
            exit 1
          fi

          rm -rf dist Payload
          mkdir -p dist Payload
          cp -R "$APP_PATH" Payload/Luna.app
          ditto -c -k --sequesterRsrc --keepParent Payload dist/Luna-unsigned.ipa
          rm -rf Payload

          shasum -a 256 dist/Luna-unsigned.ipa > dist/Luna-unsigned.ipa.sha256
          ls -lh dist/
          cat dist/Luna-unsigned.ipa.sha256

      - name: Upload workflow build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Luna-unsigned-ipa
          path: |
            dist/Luna-unsigned.ipa
            dist/Luna-unsigned.ipa.sha256
          retention-days: 30

  publish-release:
    name: Publish Rolling Latest Release
    runs-on: ubuntu-latest
    needs: [static-guardrails, linux-core-tests, test-tvos, build-ipa]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download built IPA artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Luna-unsigned-ipa
          path: dist

      - name: Verify downloaded artifacts
        run: |
          set -euo pipefail
          test -s dist/Luna-unsigned.ipa
          test -s dist/Luna-unsigned.ipa.sha256
          ls -lh dist/
          cat dist/Luna-unsigned.ipa.sha256

      - name: Publish Luna-unsigned.ipa to rolling GitHub Release 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          BUILD_UTC="$(date -u '+%Y-%m-%d %H:%M UTC')"
          NOTES="Automated tvOS unsigned build of **Luna** (\`${SHORT_SHA}\`, ${BUILD_UTC}). Ready for wireless signing & 7-day auto-renewal in **ATVLoadly**."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest HEAD
          git push origin refs/tags/latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/Luna-unsigned.ipa dist/Luna-unsigned.ipa.sha256 --clobber
            gh release edit latest --title "Luna (Latest tvOS Build)" --notes "$NOTES" --latest
          else
            gh release create latest dist/Luna-unsigned.ipa dist/Luna-unsigned.ipa.sha256 \
              --title "Luna (Latest tvOS Build)" \
              --notes "$NOTES" \
              --latest
          fi
