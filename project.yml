name: Luna
options:
  bundleIdPrefix: local.mediaos
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  AetherBridge:
    path: Packages/AetherBridge

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.2.4"
    CURRENT_PROJECT_VERSION: "9"
    TARGETED_DEVICE_FAMILY: "3"
    TVOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Luna:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: Luna
        PRODUCT_BUNDLE_IDENTIFIER: local.mediaos.luna
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - package: AetherBridge
        product: AetherBridge

  LunaTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/LunaTests
    settings:
      base:
        PRODUCT_NAME: LunaTests
        PRODUCT_BUNDLE_IDENTIFIER: local.mediaos.luna.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Luna.app/Luna"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: Luna
      - package: AetherBridge
        product: AetherBridge

schemes:
  Luna:
    build:
      targets:
        Luna: all
        LunaTests: [test]
    test:
      targets:
        - LunaTests
    archive:
      config: Release
